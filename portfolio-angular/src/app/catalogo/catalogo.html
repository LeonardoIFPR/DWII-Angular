@if (erro) {
    <p>{{ erro }}</p>
} @else {
    @if (tecnologias$ | async; as tecnologias) {
        @if (tecnologias.length === 0) {
            <p>nenhum item ainda</p>
        } @else {
            @for (t of tecnologias; track t.id) {
                <mat-card style="margin-bottom: 12px;">
                    <mat-card-header>
                        <mat-card-title>{{ t.nome }}</mat-card-title>
                        <mat-card-subtitle>{{ t.descricao }}</mat-card-subtitle>
                    </mat-card-header>
                    <mat-card-content>
                        {{ t.descricao }}
                    </mat-card-content>
                </mat-card>
            }
        }
    } @else {
        <p>Carregando catalogo...</p>
    }
}
