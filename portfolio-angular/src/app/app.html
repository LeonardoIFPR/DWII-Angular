<mat-drawer-container class="example-container" autosize>
  
  <mat-drawer #drawer class="example-sidenav" mode="side">
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }" (click)="drawer.toggle()">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>
      <a mat-list-item routerLink="/sobre" routerLinkActive="ativo" (click)="drawer.toggle()">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>Sobre</span>
      </a>
      <a mat-list-item routerLink="/projetos" routerLinkActive="ativo" (click)="drawer.toggle()">
        <mat-icon matListItemIcon>work</mat-icon>
        <span matListItemTitle>Projetos</span>
      </a>
      <a mat-list-item routerLink="/catalogo" routerLinkActive="ativo" (click)="drawer.toggle()">
        <mat-icon matListItemIcon>view_list</mat-icon>
        <span matListItemTitle>Catálogo</span>
      </a>
      <a mat-list-item routerLink="/contato" routerLinkActive="ativo" (click)="drawer.toggle()">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Contato</span>
      </a>
      <a mat-list-item routerLink="/gestao" routerLinkActive="ativo" (click)="drawer.toggle()">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Gestão</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <div class="example-sidenav-content">
    
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle sidenav">
        <mat-icon>menu</mat-icon>
      </button>
      <span style="margin-left: 8px;">Meu Portfolio</span>

      <span class="espacador"></span>

      <div>
        <a mat-button routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
        <a mat-button routerLink="/sobre" routerLinkActive="ativo">Sobre</a>
        <a mat-button routerLink="/projetos" routerLinkActive="ativo">Projetos</a>
        <a mat-button routerLink="/catalogo" routerLinkActive="ativo">Catálogo</a>
        <a mat-button routerLink="/contato" routerLinkActive="ativo">Contato</a>
        <a mat-button routerLink="/gestao" routerLinkActive="ativo">Gestão</a>      
      </div>
    </mat-toolbar>

    <main style="padding: 24px">
      <router-outlet></router-outlet>
    </main>

  </div>

</mat-drawer-container>
